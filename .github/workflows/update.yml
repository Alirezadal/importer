name: Update Telegram subscription
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: subscription-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install Xray core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo XTLS/Xray-core --pattern Xray-linux-64.zip --dir /tmp/xray-release
          unzip -q /tmp/xray-release/Xray-linux-64.zip -d /tmp/xray-core
          sudo install /tmp/xray-core/xray /usr/local/bin/xray
      - run: python main.py
      - name: Commit subscription
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subscription.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update subscription'
          git push
